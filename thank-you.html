<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | White Horse &amp; Carriage Co.</title>
  <meta name="description" content="Thank you for your inquiry with White Horse &amp; Carriage Co. We will be in touch within 24 hours." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://whitehorseandcarriage.com/thank-you" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Cinzel:wght@400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --cream:#f5f0e8; --gold:#b8923a; --gold-light:#d4aa5a; --dark:#1a1510; --muted:#7a6e62; }
    body {
      font-family: 'Jost', sans-serif; min-height: 100vh; color: var(--cream);
      display: flex; flex-direction: column;
      background:
        linear-gradient(160deg, rgba(26,21,16,0.88), rgba(46,40,32,0.78)),
        url('https://raw.githubusercontent.com/christina-whcc/whcc/06e5696f60eb2e71e09c0598d3578d1f263e4862/wedding.jpg') center/cover no-repeat;
    }
    header { padding: 1.4rem 2rem; border-bottom: 1px solid rgba(184,146,58,0.3); }
    .logo { font-family: 'Cinzel', serif; color: var(--gold-light); letter-spacing: 0.12em; text-decoration: none; font-size: 1.05rem; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; text-align: center; }
    .box { max-width: 640px; animation: fadeUp 1s ease both; }
    .eyebrow { font-size: 0.72rem; letter-spacing: 0.45em; text-transform: uppercase; color: var(--gold); margin-bottom: 1.2rem; }
    h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(2.8rem, 8vw, 5rem); line-height: 1.05; margin-bottom: 1rem; }
    h1 em { font-style: italic; color: var(--gold-light); }
    .divider { width: 80px; height: 1px; background: var(--gold); margin: 1.5rem auto; }
    p { font-size: 1.02rem; line-height: 1.8; font-weight: 300; color: rgba(245,240,232,0.82); margin-bottom: 1rem; }
    p a { color: var(--gold-light); text-decoration: none; }
    .btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 2rem; }
    .btn { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.25em; text-transform: uppercase; text-decoration: none; padding: 1rem 2.2rem; transition: background 0.25s, border-color 0.25s; }
    .btn-gold { background: var(--gold); color: var(--dark); }
    .btn-gold:hover { background: var(--gold-light); }
    .btn-line { color: var(--cream); border: 1px solid rgba(245,240,232,0.4); }
    .btn-line:hover { border-color: var(--gold); color: var(--gold-light); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <header><a href="/" class="logo">White Horse &amp; Carriage Co.</a></header>
  <main>
    <div class="box">
      <p class="eyebrow">Inquiry Received</p>
      <h1>Thank <em>You</em></h1>
      <div class="divider"></div>
      <p>We have your inquiry and are looking forward to being part of your event. A member of our team will be in touch within 24 hours with availability and next steps.</p>
      <p>Need to reach us sooner? Call <a href="tel:2106464102">(210) 646-4102</a>.</p>
      <div class="btns">
        <a href="/" class="btn btn-gold">Back to Home</a>
        <a href="https://www.instagram.com/whitehorseandcarriageco" target="_blank" rel="noopener noreferrer" class="btn btn-line">Follow on Instagram</a>
      </div>
    </div>
  </main>
</body>
</html>
